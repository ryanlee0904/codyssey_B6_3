{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="narrow card center">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="actions center">
    <a class="btn" href="/">홈으로</a>
    {% if current_user %}<a class="btn btn-outline" href="/app/goods">상품 목록</a>{% endif %}
  </div>
</div>
{% endblock %}
