{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>회원가입</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup" class="form">
    <label>아이디 <span class="muted small">(영문/숫자/_ 4~20자)</span>
      <input name="username" value="{{ form.username or '' }}" required minlength="4" maxlength="20">
    </label>
    <label>닉네임
      <input name="nickname" value="{{ form.nickname or '' }}" required maxlength="20">
    </label>
    <label>비밀번호 <span class="muted small">(8자 이상)</span>
      <input type="password" name="password" required minlength="8">
    </label>
    <label>비밀번호 확인
      <input type="password" name="password_confirm" required minlength="8">
    </label>
    <button type="submit" class="btn btn-block">가입하기</button>
  </form>
  <p class="small">이미 계정이 있나요? <a href="/login">로그인</a></p>
</div>
{% endblock %}
